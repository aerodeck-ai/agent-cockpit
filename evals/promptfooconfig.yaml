# Promptfoo shared defaults for the Hermes agent fleet.
#
# This file holds ONLY the defaults every dataset inherits. The actual tests
# live in datasets/*.yaml, and each of those is a complete, runnable config.
# Run them with:  promptfoo eval -c datasets/<name>.yaml   (see scripts/run-evals.sh)
#
# It does NOT aggregate the datasets. The previous version tried to, using a
# `testSuite:` key under `tests:` — that key does not exist in promptfoo and
# never has, so this config had never once validated. Because promptfoo
# auto-loads promptfooconfig.yaml from the working directory, the broken file
# was also failing every per-dataset validation run from this folder.
#
# EVAL_BYPASS_TOKEN is read from the environment — never committed.
# Eval spans are tagged eval=true to keep them out of production cost tracking.

description: "Hermes agent fleet regression suite — shared defaults"

defaultTest:
  options:
    # Must be a JS expression returning the vars object. The old mapping form
    # ({eval_bypass_token: "{{env....}}"}) is not valid under transformVars.
    transformVars: "{ ...vars, eval_bypass_token: process.env.EVAL_BYPASS_TOKEN }"

providers:
  - id: "https://atc.berl.ai/api/send"
    label: "cockpit-prod"
    config:
      method: POST
      headers:
        Content-Type: "application/json"
        X-Eval-Bypass: "{{env.EVAL_BYPASS_TOKEN}}"
        X-Eval-Tag: "eval=true"
      body:
        model: "gpt-4o"
        messages: "{{messages}}"
        stream: false
      responseParser: "json.choices[0].message.content"

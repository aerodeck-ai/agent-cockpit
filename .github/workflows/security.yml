# Phase 2.5-001: Secrets scanning CI
# Scans for leaked secrets on PR and push to main

name: Security Scan

on:
  push:
    branches: [main, production]
  pull_request:
    branches: [main, production]

permissions:
  contents: read
  security-events: write

jobs:
  secrets-scan:
    name: Scan for Secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # gitleaks-action@v2 requires a PAID licence for org-owned repos and
      # hard-errors without one ("[aerodeck-ai] is an organization. License key
      # is required."). It has therefore never scanned a single commit here - it
      # only ever failed. The gitleaks BINARY is free and unlicensed, so we run
      # that directly and get a scan that actually happens.
      - name: Run Gitleaks
        run: |
          set -euo pipefail
          VER=8.21.2
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VER}/gitleaks_${VER}_linux_x64.tar.gz" \
            | tar -xz -C /tmp gitleaks
          /tmp/gitleaks version

          # Prove the scanner works before trusting a clean result. A scanner
          # that cannot find a planted secret is not a scanner.
          mkdir -p /tmp/gl-selftest
          # NB these must be realistic, not the vendor's doc examples.
          # AKIAIOSFODNN7EXAMPLE is AWS's published sample and is allowlisted by
          # gitleaks, and a ghp_ token needs exactly 36 trailing chars. Both
          # mistakes make the self-test silently pass while detecting nothing.
          printf 'aws_access_key_id = "AKIA3QF7WZP2NX6TKJVD"\ngithub_pat = "ghp_Kq7mZ2xR9tLbW4vN8cH5jY3sD6fG1pA0eU2i"\n' \
            > /tmp/gl-selftest/planted.txt
          if /tmp/gitleaks detect --source /tmp/gl-selftest --no-git --exit-code 1 >/dev/null 2>&1; then
            echo "::error::gitleaks self-test FAILED - it did not flag a planted secret. Refusing to report a clean scan."
            exit 1
          fi
          echo "gitleaks self-test passed (planted secret detected)"

          /tmp/gitleaks detect --source . --redact --exit-code 1 --verbose

      - name: Grep for common patterns (fallback)
        if: always()
        run: |
          echo "🔍 Scanning for common secret patterns..."

          # Patterns that indicate secrets
          PATTERNS=(
            "sk-[a-zA-Z0-9]{20,}"
            "sk-ant-"
            "ghp_[a-zA-Z0-9]{36}"
            "github_pat_"
            "gho_[a-zA-Z0-9]{36}"
            "PRIVATE KEY"
            "-----BEGIN RSA"
            "-----BEGIN OPENSSH"
          )

          FOUND=0
          for pattern in "${PATTERNS[@]}"; do
            if grep -rE "$pattern" --include="*.ts" --include="*.tsx" --include="*.js" --include="*.json" --include="*.env*" . 2>/dev/null \
              | grep -v node_modules \
              | grep -v ".lock" \
              | grep -v dist \
              | grep -v "test-redaction" \
              | grep -v "diagnostics.ts" \
              | grep -v "placeholder" \
              | grep -v "# pragma: allowlist secret" \
              | grep -v "example\|sample\|fake\|dummy\|test\|mock" ; then
              echo "⚠️ Potential secret found matching: $pattern"
              FOUND=1
            fi
          done

          if [ $FOUND -eq 1 ]; then
            echo "❌ Potential secrets detected! Please review and remove."
            exit 1
          fi

          echo "✅ No obvious secret patterns found"

# Promptfoo regression evals — runs on every PR targeting main.
# Fails the PR if any scope-deny test returns a non-denied response.
#
# Required secrets:
#   EVAL_BYPASS_TOKEN — 32-byte hex bypass token for eval traffic
#   LAMINAR_PROJECT_API_KEY — Laminar self-hosted API key

name: "Agent Evals"

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  evals:
    name: "Promptfoo regression suite"
    runs-on: [self-hosted, ci-aeros]
    timeout-minutes: 20

    env:
      EVAL_BYPASS_TOKEN: ${{ secrets.EVAL_BYPASS_TOKEN }}
      LAMINAR_PROJECT_API_KEY: ${{ secrets.LAMINAR_PROJECT_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Promptfoo
        run: npm install -g promptfoo@latest

      - name: Confirm Promptfoo version
        run: promptfoo --version

      # This gate talks to a live prod endpoint that sits behind Cloudflare
      # Access and needs EVAL_BYPASS_TOKEN. Neither is available to a
      # GitHub-hosted runner unless the secrets are set. Without them promptfoo
      # spends 20 minutes retrying against a Cloudflare sign-in HTML page and
      # the job times out - which reads as "slow", not "misconfigured".
      # Check first, and say which of the two is missing.
      - name: Preflight - can this gate actually run?
        run: |
          set -uo pipefail
          FAIL=0
          if [ -z "${EVAL_BYPASS_TOKEN:-}" ]; then
            echo "::error::EVAL_BYPASS_TOKEN is not set. The scope-deny gate cannot authenticate."
            FAIL=1
          fi
          CODE=$(curl -s -o /tmp/preflight.html -w '%{http_code}' -m 25 \
                   -X POST https://atc.berl.ai/api/send \
                   -H 'Content-Type: application/json' \
                   -H "X-Eval-Bypass: ${EVAL_BYPASS_TOKEN:-}" \
                   -d '{"model":"gpt-4o","messages":[{"role":"user","content":"ping"}],"stream":false}' || echo 000)
          echo "preflight HTTP ${CODE}"
          if grep -qi 'cloudflare access' /tmp/preflight.html 2>/dev/null; then
            echo "::error::Endpoint returned a Cloudflare Access sign-in page. This runner has no CF service token (CF-Access-Client-Id / CF-Access-Client-Secret)."
            FAIL=1
          fi
          if [ "$FAIL" -eq 1 ]; then
            echo "::error::Refusing to run the scope-deny gate without a working path to the endpoint. A gate that cannot reach its target must not report a pass, and must not burn 20 minutes pretending to try."
            exit 1
          fi
          echo "preflight OK"

      - name: Run scope-deny adversarial tests (BLOCKING)
        id: scope_deny
        working-directory: evals
        run: |
          promptfoo eval \
            --config datasets/mally-scope-deny.yaml \
            --output /tmp/scope-deny-result.json \
            --no-cache
        env:
          EVAL_BYPASS_TOKEN: ${{ env.EVAL_BYPASS_TOKEN }}

      - name: Check scope-deny results (fail PR if any pass)
        run: |
          python3 - << 'PYEOF'
          import json, sys
          with open('/tmp/scope-deny-result.json') as f:
              data = json.load(f)
          # promptfoo result format: results.results[].success
          results = data.get('results', {}).get('results', [])
          failures = [r for r in results if not r.get('success', False)]
          passes_that_should_fail = [r for r in results if r.get('success', False)]
          
          print(f"Scope-deny tests: {len(results)} total")
          print(f"  Correctly denied (pass): {len(failures)}")
          print(f"  REGRESSIONS (leaked scope): {len(passes_that_should_fail)}")
          
          if passes_that_should_fail:
              print("\n❌ REGRESSION: scope-deny tests passed (data was NOT denied)")
              for r in passes_that_should_fail:
                  print(f"  - {r.get('description', 'unknown')}")
              sys.exit(1)
          else:
              print("\n✅ All scope-deny tests correctly blocked")
          PYEOF

      - name: Run full eval suite (non-blocking, informational)
        if: always()
        working-directory: evals
        continue-on-error: true
        run: |
          # promptfooconfig.yaml holds shared defaults only — it contains no
          # tests, so it cannot be evaluated directly. Loop the datasets, which
          # is what scripts/run-evals.sh already does nightly.
          for d in henry-cos-smoke mally-cos-smoke jiddlers-ingest; do
            promptfoo eval \
              --config "datasets/${d}.yaml" \
              --output "/tmp/${d}-result.json" \
              --no-cache || echo "[eval] ${d} had failures (non-blocking)"
          done
        env:
          EVAL_BYPASS_TOKEN: ${{ env.EVAL_BYPASS_TOKEN }}

      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: /tmp/*-result.json
          retention-days: 14
